<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#080d18" />
<title>Dot Matrix Snake</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080d18;
    --panel: rgba(17, 27, 46, .82);
    --line: rgba(137, 164, 205, .16);
    --text: #edf5ff;
    --muted: #8ea2bf;
    --green: #65f5b1;
    --cyan: #50d9ff;
    --pink: #ff6b91;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 22px; color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(29, 100, 130, .22), transparent 38%),
      radial-gradient(ellipse at 90% 85%, rgba(82, 49, 135, .22), transparent 38%), var(--bg);
  }
  .app { width: min(100%, 850px); }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; }
  .eyebrow { color:var(--green); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; font-weight:800; }
  h1 { margin:5px 0 0; font-size:clamp(1.65rem, 5vw, 2.5rem); letter-spacing:-.045em; }
  h1 span { color:var(--green); }
  .stats { display:flex; gap:10px; }
  .stat { min-width:88px; padding:10px 14px; border:1px solid var(--line); border-radius:14px; background:var(--panel); text-align:center; }
  .stat small { display:block; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; }
  .stat strong { display:block; font-size:1.35rem; margin-top:2px; font-variant-numeric:tabular-nums; }
  .game-shell { padding:12px; border:1px solid rgba(132, 169, 211, .2); border-radius:22px; background:linear-gradient(145deg, rgba(21,33,54,.94), rgba(9,15,27,.96)); box-shadow:0 24px 80px rgba(0,0,0,.4), inset 0 1px rgba(255,255,255,.04); }
  .stage { position:relative; overflow:hidden; border-radius:14px; background:#07111b; }
  canvas { display:block; width:100%; aspect-ratio: 1.55 / 1; touch-action:none; }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:20px; background:rgba(4,10,19,.64); backdrop-filter:blur(5px); text-align:center; }
  .overlay.hidden { display:none; }
  .overlay-card { max-width:340px; }
  .overlay h2 { margin:0 0 8px; font-size:clamp(1.4rem,4vw,2rem); }
  .overlay p { color:#aabbd0; line-height:1.55; margin:0 0 18px; }
  button { border:0; color:#06140f; background:var(--green); border-radius:12px; padding:11px 18px; font-weight:800; cursor:pointer; transition:transform .15s, filter .15s; }
  button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  button:active { transform:scale(.97); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 4px 2px; flex-wrap:wrap; }
  .hint { color:var(--muted); font-size:.82rem; }
  .actions { display:flex; gap:8px; }
  .secondary { color:var(--text); background:#1a2940; border:1px solid var(--line); padding:9px 13px; }
  .controls { display:none; justify-content:center; margin:16px auto 2px; }
  .pad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,48px); gap:6px; }
  .pad button { color:var(--text); background:#172943; border:1px solid var(--line); font-size:1.15rem; padding:0; touch-action:manipulation; }
  .pad .up { grid-column:2; }
  .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; }
  .pad .right { grid-column:3; grid-row:2; }
  footer { text-align:center; color:#6f829d; font-size:.72rem; margin-top:14px; }
  @media (max-width:650px) {
    body { padding:14px; align-items:start; }
    header { align-items:flex-start; flex-direction:column; }
    .stats { width:100%; }
    .stat { flex:1; }
    .game-shell { padding:8px; }
    canvas { aspect-ratio:1 / 1; }
    .controls { display:flex; }
    .hint { width:100%; text-align:center; }
    .toolbar { justify-content:center; }
  }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none !important; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <div class="eyebrow">Arcade · Infinite edges</div>
      <h1>DOT MATRIX <span>SNAKE</span></h1>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><small>Score</small><strong id="score">0</strong></div>
      <div class="stat"><small>Best</small><strong id="best">0</strong></div>
    </div>
  </header>

  <section class="game-shell" aria-label="Snake game">
    <div class="stage">
      <canvas id="game" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">Ready to slither?</h2>
          <p id="overlayText">Collect the glowing orbs, grow longer, and keep moving. Cross an edge to emerge from the opposite side.</p>
          <button id="startBtn">Start game</button>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="hint">Move: <b>Arrow keys</b> / <b>W A S D</b> · Pause: <b>Space</b></div>
      <div class="actions">
        <button class="secondary" id="pauseBtn">Pause</button>
        <button class="secondary" id="restartBtn">Restart</button>
      </div>
    </div>
  </section>

  <div class="controls" aria-label="Touch controls">
    <div class="pad">
      <button class="up" data-dir="up" aria-label="Move up">▲</button>
      <button class="left" data-dir="left" aria-label="Move left">◀</button>
      <button class="down" data-dir="down" aria-label="Move down">▼</button>
      <button class="right" data-dir="right" aria-label="Move right">▶</button>
    </div>
  </div>
  <footer>DOT MATRIX ENGINE · WALL WRAP ENABLED · COLLECT · GROW · REPEAT</footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  // Logical dot-matrix dimensions. The canvas scales these dots to any screen.
  const COLS = 52, ROWS = 34;
  let cell = 12, width = 624, height = 408;
  let snake, direction, nextDirection, food, score, best, running, gameOver, lastTick, accumulator;
  const STEP_MS = 112;
  best = Number(localStorage.getItem('dotSnakeBest') || 0);
  bestEl.textContent = best;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = rect.width; height = rect.height;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.min(width / COLS, height / ROWS);
    draw();
  }
  function reset() {
    snake = [{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)},{x:Math.floor(COLS/2)-1,y:Math.floor(ROWS/2)},{x:Math.floor(COLS/2)-2,y:Math.floor(ROWS/2)}];
    direction = {x:1,y:0}; nextDirection = {x:1,y:0};
    score = 0; scoreEl.textContent = score;
    gameOver = false; running = false; accumulator = 0;
    spawnFood(); draw();
  }
  function spawnFood() {
    do { food = {x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function setDirection(name) {
    const dirs = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    const d = dirs[name];
    if (!d || (d.x === -direction.x && d.y === -direction.y)) return;
    nextDirection = d;
    if (!running && !gameOver && overlay.classList.contains('hidden')) running = true;
  }
  function tick() {
    direction = nextDirection;
    const head = {x:(snake[0].x + direction.x + COLS) % COLS, y:(snake[0].y + direction.y + ROWS) % ROWS};
    const eating = head.x === food.x && head.y === food.y;
    const bodyToCheck = eating ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) {
      running = false; gameOver = true;
      overlayTitle.textContent = 'Game over';
      overlayText.textContent = `You scored ${score}. Your snake ran into itself.`;
      startBtn.textContent = 'Play again';
      overlay.classList.remove('hidden');
      return;
    }
    snake.unshift(head);
    if (eating) {
      score += 10; scoreEl.textContent = score;
      if (score > best) {
        best = score; bestEl.textContent = best;
        localStorage.setItem('dotSnakeBest', best);
      }
      spawnFood();
    } else snake.pop();
  }
  function draw() {
    if (!ctx || !width || !height) return;
    ctx.clearRect(0,0,width,height);
    ctx.fillStyle = '#07111b'; ctx.fillRect(0,0,width,height);

    // Dot matrix background.
    const spacingX = width / COLS, spacingY = height / ROWS;
    for (let y=0; y<ROWS; y++) for (let x=0; x<COLS; x++) {
      ctx.beginPath();
      ctx.arc((x+.5)*spacingX, (y+.5)*spacingY, Math.max(1, Math.min(spacingX,spacingY)*.105), 0, Math.PI*2);
      ctx.fillStyle = ((x+y)%2===0) ? 'rgba(91,126,158,.25)' : 'rgba(91,126,158,.15)';
      ctx.fill();
    }

    // Food orb with a soft glow.
    const fx=(food.x+.5)*spacingX, fy=(food.y+.5)*spacingY;
    ctx.save(); ctx.shadowColor='#ff6b91'; ctx.shadowBlur=18;
    const pulse = 1 + Math.sin(performance.now()/180)*.13;
    ctx.beginPath(); ctx.arc(fx,fy,Math.min(spacingX,spacingY)*.34*pulse,0,Math.PI*2);
    ctx.fillStyle='#ff789b'; ctx.fill(); ctx.restore();

    // Snake is rendered as a connected chain of glowing dots.
    snake.forEach((part,i) => {
      const x=(part.x+.5)*spacingX, y=(part.y+.5)*spacingY;
      const radius=Math.min(spacingX,spacingY)*(i===0?.43:.37);
      ctx.save();
      ctx.shadowColor = i===0 ? '#8affc7' : '#42d99a';
      ctx.shadowBlur = i===0 ? 18 : 9;
      ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2);
      ctx.fillStyle = i===0 ? '#c2ffe2' : `hsl(${148 + Math.min(i,25)*.7} 76% ${62-Math.min(i,25)*.45}%)`;
      ctx.fill(); ctx.restore();
    });
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (running) {
      if (!lastTick) lastTick=now;
      accumulator += Math.min(now-lastTick, 250);
      lastTick=now;
      while (accumulator >= STEP_MS) { tick(); accumulator -= STEP_MS; if (!running) break; }
      draw();
    } else lastTick=now;
  }
  function start() {
    if (gameOver) reset();
    running = true; overlay.classList.add('hidden'); pauseBtn.textContent='Pause';
    lastTick=0; accumulator=0;
  }
  function pause() {
    if (gameOver) return;
    if (running) {
      running=false; overlayTitle.textContent='Paused'; overlayText.textContent='Take a breather. Your snake is waiting.'; startBtn.textContent='Resume'; overlay.classList.remove('hidden'); pauseBtn.textContent='Resume';
    } else if (overlay.classList.contains('hidden')) start();
    else if (snake) start();
  }
  function restart() {
    reset(); overlayTitle.textContent='Ready to slither?'; overlayText.textContent='Collect the glowing orbs, grow longer, and keep moving. Cross an edge to emerge from the opposite side.'; startBtn.textContent='Start game'; overlay.classList.remove('hidden'); pauseBtn.textContent='Pause';
  }

  document.addEventListener('keydown', e => {
    const keys = {ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
    if (keys[e.key]) { e.preventDefault(); setDirection(keys[e.key]); if (!running && overlay.classList.contains('hidden')) start(); }
    if (e.code === 'Space') { e.preventDefault(); pause(); }
    if (e.key === 'Enter' && !overlay.classList.contains('hidden')) start();
  });
  document.querySelectorAll('[data-dir]').forEach(btn => {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); setDirection(btn.dataset.dir); if (!running && overlay.classList.contains('hidden')) start(); });
  });
  // Swipe support for phones and tablets.
  let touchStart=null;
  canvas.addEventListener('pointerdown', e => { touchStart={x:e.clientX,y:e.clientY}; });
  canvas.addEventListener('pointerup', e => {
    if (!touchStart) return;
    const dx=e.clientX-touchStart.x, dy=e.clientY-touchStart.y;
    if (Math.max(Math.abs(dx),Math.abs(dy))>18) setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
    touchStart=null;
  });
  startBtn.addEventListener('click',start);
  pauseBtn.addEventListener('click',pause);
  document.getElementById('restartBtn').addEventListener('click',restart);
  window.addEventListener('resize',resize);

  reset(); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
